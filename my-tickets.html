<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vé Của Tôi | CineManager</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/booking.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration:none;"><h1>Cine<span>Manager</span></h1></a></div>
        <div class="auth-controls">
            <div id="user-info">
                Chào, <span id="display-username" style="color:var(--primary);font-weight:bold;"></span>
                <a href="index.html"><button class="secondary">🏠 Trang chủ</button></a>
                <button onclick="handleLogout()">Đăng xuất</button>
            </div>
        </div>
    </header>

    <main style="padding: 2rem 5%;">
        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
            <a href="index.html" style="text-decoration: none;">
                <button class="secondary" style="padding: 0.5rem 1rem; border-radius: 50px;">← Quay lại</button>
            </a>
            <h2 style="margin: 0;">🎫 Vé Của Tôi</h2>
        </div>
        <div id="tickets-list">
            <p style="color:var(--text-muted)">Đang tải...</p>
        </div>
    </main>

    <script src="assets/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authRes = await fetch('api/auth.php?action=check');
            const authData = await authRes.json();
            if (!authData.isLoggedIn) { window.location.href = 'login.html'; return; }
            document.getElementById('display-username').innerText = authData.username;

            const res = await fetch('api/bookings.php');
            const tickets = await res.json();
            const list = document.getElementById('tickets-list');

            if (!tickets.length) {
                list.innerHTML = `
                    <div style="text-align:center; padding:4rem 0; color:var(--text-muted)">
                        <div style="font-size:3rem; margin-bottom:1rem">🎟️</div>
                        <p>Bạn chưa đặt vé nào.</p>
                        <a href="index.html"><button style="margin-top:1.5rem">Xem phim ngay</button></a>
                    </div>`;
                return;
            }

            list.innerHTML = tickets.map(t => {
                const combos = t.combo_json ? JSON.parse(t.combo_json) : [];
                const comboText = combos.length ? combos.map(c => `${c.name} x${c.qty}`).join(', ') : 'Không có combo';
                const date = new Date(t.show_date).toLocaleDateString('vi-VN');
                const badge = t.status === 'confirmed'
                    ? '<span style="background:#28a745; color:white; padding:0.2rem 0.6rem; border-radius:20px; font-size:0.75rem;">✓ Đã đặt</span>'
                    : '<span style="background:#dc3545; color:white; padding:0.2rem 0.6rem; border-radius:20px; font-size:0.75rem;">✗ Đã hủy</span>';
                
                // Tạo data cho QR
                const ticketData = encodeURIComponent(`CineManager Ticket #${t.id}\nPhim: ${t.movie_title}\nGhế: ${t.seats}`);
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${ticketData}`;

                return `
                    <div class="ticket-card" style="display:flex; align-items:center; gap:1.5rem; position:relative;">
                        <img class="ticket-poster" src="${t.poster_url || 'https://via.placeholder.com/100x150?text=?'}" alt="${t.movie_title}">
                        <div class="ticket-info" style="flex:1">
                            <h3 style="margin-bottom:0.5rem">${t.movie_title} ${badge}</h3>
                            <p>🏛️ ${t.room_name}</p>
                            <p>📅 ${date} — ⏰ ${t.show_time.slice(0,5)}</p>
                            <p>🪑 Ghế: <strong>${t.seats}</strong></p>
                            <p>🍿 Combo: ${comboText}</p>
                            <p style="color:var(--text-muted); font-size:0.8rem; margin-top:0.5rem;">Đặt lúc: ${new Date(t.created_at).toLocaleString('vi-VN')}</p>
                        </div>
                        <div class="ticket-qr" style="background:white; padding:5px; border-radius:5px;">
                            <img src="${qrUrl}" alt="QR">
                        </div>
                        <div class="ticket-price" style="min-width:120px; text-align:right;">
                            <strong style="display:block; font-size:1.2rem; color:var(--primary)">${Number(t.total_price).toLocaleString('vi-VN')} đ</strong>
                            <small style="color:var(--text-muted)">Mã vé: #${t.id}</small>
                        </div>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
